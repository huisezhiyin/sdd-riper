<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Agent 工程任务包闭环</title>
  <desc id="desc">从目标、上下文、边界、验收、回收到 Agent 自主推进，再由 checkpoint 与证据完成控盘闭环。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 760; }
      .subtitle { font-size: 20px; fill: #586479; }
      .node-title { font-size: 25px; font-weight: 740; }
      .node-copy { font-size: 17px; fill: #4f5b70; }
      .pill { font-size: 18px; font-weight: 680; fill: #24304a; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#516078"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#f7f8fb"/>
  <text x="600" y="56" text-anchor="middle" class="title">把工程任务包装成 Agent 可推进的闭环</text>
  <text x="600" y="90" text-anchor="middle" class="subtitle">人类设计任务轨道，Agent 推动执行，证据负责收束</text>

  <rect x="70" y="155" width="270" height="290" rx="12" fill="#ffffff" stroke="#d7ddea" stroke-width="2"/>
  <text x="205" y="200" text-anchor="middle" class="node-title">任务包</text>
  <rect x="105" y="228" width="200" height="38" rx="19" fill="#edf3ff"/>
  <text x="205" y="253" text-anchor="middle" class="pill">目标 Goal</text>
  <rect x="105" y="276" width="200" height="38" rx="19" fill="#edf3ff"/>
  <text x="205" y="301" text-anchor="middle" class="pill">上下文 Context</text>
  <rect x="105" y="324" width="200" height="38" rx="19" fill="#edf3ff"/>
  <text x="205" y="349" text-anchor="middle" class="pill">边界 Boundary</text>
  <rect x="105" y="372" width="200" height="38" rx="19" fill="#edf3ff"/>
  <text x="205" y="397" text-anchor="middle" class="pill">验收 Validation</text>

  <rect x="465" y="155" width="270" height="290" rx="12" fill="#fffdf5" stroke="#e1c572" stroke-width="2"/>
  <text x="600" y="215" text-anchor="middle" class="node-title">Agent 自主推进</text>
  <text x="600" y="260" text-anchor="middle" class="node-copy">阅读地形 / 拆解任务</text>
  <text x="600" y="295" text-anchor="middle" class="node-copy">实现 / 修错 / 补验证</text>
  <text x="600" y="330" text-anchor="middle" class="node-copy">根据反馈继续收敛</text>
  <text x="600" y="365" text-anchor="middle" class="node-copy">输出 diff、日志、测试证据</text>

  <rect x="860" y="155" width="270" height="290" rx="12" fill="#f2fbf6" stroke="#75b98d" stroke-width="2"/>
  <text x="995" y="215" text-anchor="middle" class="node-title">人类控盘</text>
  <text x="995" y="260" text-anchor="middle" class="node-copy">checkpoint 看方向</text>
  <text x="995" y="295" text-anchor="middle" class="node-copy">证据验收结果</text>
  <text x="995" y="330" text-anchor="middle" class="node-copy">识别未覆盖风险</text>
  <text x="995" y="365" text-anchor="middle" class="node-copy">决定是否回写经验</text>

  <line x1="350" y1="300" x2="445" y2="300" stroke="#516078" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="745" y1="300" x2="840" y2="300" stroke="#516078" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 995 465 C 995 560, 205 560, 205 465" fill="none" stroke="#516078" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="600" y="540" text-anchor="middle" class="subtitle">回收 Recovery：把规则、测试入口、README、Spec 或经验资产沉淀为下一次地形</text>
</svg>
